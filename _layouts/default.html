<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    <basefont face="Tahoma, Verdana, Arial, sans-serif">

    <table class="window" width="800" border="0" cellpadding="0" cellspacing="0">

      <tr><td class="titlebar">
        <span class="titlecaption">{{ page.title | default: site.title }} - {{ site.author }}</span>
      </td></tr>

      <tr><td class="menubar">
        {% include header.html %}
      </td></tr>

      <tr><td class="window-body">
        <div class="content">
          {{ content }}
        </div>
      </td></tr>

      <tr><td class="statusbar">
        {% include footer.html %}
      </td></tr>

    </table>

  </body>

</html>
