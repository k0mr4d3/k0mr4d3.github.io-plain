<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    <!-- The window is built from tables, not divs: IE 3 predates <div> and would
         collapse div-based chrome into one line. Tables are IE 3's native block
         layout, so it degrades to readable stacked rows; IE 5+ get the CSS look. -->
    <table class="window" align="center" border="0" cellpadding="0" cellspacing="0">

      <tr><td class="titlebar">
        <span class="titlecaption">{{ page.title | default: site.title }} &mdash; {{ site.author }}</span>
      </td></tr>

      <tr><td class="menubar">
        {% include header.html %}
      </td></tr>

      <tr><td class="window-body">
        <div class="content">
          {{ content }}
        </div>
      </td></tr>

      <tr><td class="statusbar">
        {% include footer.html %}
      </td></tr>

    </table>

  </body>

</html>
