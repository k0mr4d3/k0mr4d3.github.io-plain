---
layout: default
---
<article>

  <header>
    <h1>Posts tagged &ldquo;{{ page.tag }}&rdquo;</h1>
  </header>

  <ul>
  {% for post in site.tags[page.tag] %}
    {% unless post.draft %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <time>&middot; {{ post.date | date: "%b %-d, %Y" }}</time>
    </li>
    {% endunless %}
  {% endfor %}
  </ul>

  <p><a href="{{ site.baseurl }}/tag/">All tags</a></p>

</article>
