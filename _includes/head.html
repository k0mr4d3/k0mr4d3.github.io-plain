<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.author | escape }}{% endif %} &raquo; {{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Tasteful Y2K nod: keeps the lean structure, adds period touches with
       plain CSS1 + a couple of old HTML tags (marquee, beveled hr). IE 5+ get
       the full palette; IE 3-4 fall back to plain rules and default fonts;
       everything stays readable with no CSS at all. -->
  <style type="text/css">
    body {
      background: #e5e5e5;                        /* soft silver-gray page */
      color: #000000;
      font-family: Verdana, Geneva, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
      padding: 16px 20px;
    }
    h1, h2, h3, h4 { color: #000066; }            /* deep navy headings */
    a:link    { color: #0000cc; }                 /* classic web link colors */
    a:visited { color: #660099; }
    a:hover   { color: #cc0000; }
    hr {
      height: 2px; border: 0;
      border-top: 2px groove #999999;             /* beveled rule (IE 3 shows a plain hr) */
    }
    marquee { color: #006666; }                   /* gentle teal marquee text */

    .highlight { padding-left: 2em; }
    .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn,
    .highlight .kp, .highlight .kr, .highlight .kt, .highlight .kv {
      font-weight: bold;
    }
    .highlight .c, .highlight .ch, .highlight .cm, .highlight .cp,
    .highlight .cpf, .highlight .c1, .highlight .cs, .highlight .cd {
      font-style: italic;
    }
  </style>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <!-- Icon stuff -->
  <link rel="shortcut icon" href="{{ site.github.url }}/images/favicon.ico">
</head>
