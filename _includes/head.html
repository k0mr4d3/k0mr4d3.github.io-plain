<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.author | escape }}{% endif %} &raquo; {{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Windows 98/2000 desktop theme. Plain CSS1 bevels + system font, no
       images/gradients/web fonts. IE 5 and up get the full look; browsers
       without CSS (IE 3-4, text browsers) ignore it all and render the plain,
       readable HTML underneath. -->
  <style type="text/css">
    body {
      background: #008080;                 /* iconic teal desktop */
      color: #000000;
      font-family: "MS Sans Serif", Tahoma, Geneva, sans-serif;
      font-size: 15px;
      margin: 0;
      padding: 20px 8px;
    }

    /* The window (a <table>, centered via its align="center" attribute so IE 3
       can center it too): raised silver panel, width-capped. */
    .window {
      width: 800px;                        /* IE 5 cap: fixed, never stretches on hi-res */
      padding: 3px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;    border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;  border-bottom: 2px solid #808080;
    }
    /* Modern browsers only (IE <= 8 ignore media queries): fill the container up
       to the cap, so every page is the same width and it shrinks on small
       screens. width:100% (not auto) because a <table> with auto width sizes to
       its content; border-box keeps padding/border from overflowing. IE 5 keeps
       the fixed 800px above. */
    @media screen and (min-width: 1px) {
      .window { width: 100%; max-width: 800px; box-sizing: border-box; }
    }

    /* Title bar */
    .titlebar { background: #000080; padding: 3px; }
    .titlecaption { color: #ffffff; font-weight: bold; }
    .titlebuttons { white-space: nowrap; }
    .tbtn, .winicon {
      background: #c0c0c0; color: #000000;
      font-family: monospace; font-weight: bold; padding: 0 4px;
      border-top: 1px solid #ffffff;   border-left: 1px solid #ffffff;
      border-right: 1px solid #808080; border-bottom: 1px solid #808080;
    }
    .tbtn { margin-left: 2px; }
    .winicon { color: #000080; margin-right: 5px; }

    /* Menu bar */
    .menubar { background: #c0c0c0; padding: 3px 2px; margin-top: 2px; }
    .menuitem { color: #000000; text-decoration: none; padding: 2px 10px; }
    .menuitem:hover { background: #000080; color: #ffffff; }

    /* Content: white sunken 'document' field, comfortable reading size */
    .window-body { padding: 8px; }
    .content {
      background: #ffffff; color: #000000;
      padding: 16px 22px; font-size: 15px; line-height: 1.5;
      border-top: 2px solid #808080;   border-left: 2px solid #808080;
      border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff;
    }

    /* Status bar: sunken cells */
    .statusbar { padding: 3px 4px 4px; }
    .statuscell {
      color: #000000; font-size: 12px; padding: 1px 6px;
      border-top: 1px solid #808080;   border-left: 1px solid #808080;
      border-right: 1px solid #ffffff; border-bottom: 1px solid #ffffff;
    }

    /* Code: keep the build-time highlight; the indent works on IE 5 (it has padding). */
    .highlight { padding-left: 2em; }
    .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn,
    .highlight .kp, .highlight .kr, .highlight .kt, .highlight .kv {
      font-weight: bold;
    }
    .highlight .c, .highlight .ch, .highlight .cm, .highlight .cp,
    .highlight .cpf, .highlight .c1, .highlight .cs, .highlight .cd {
      font-style: italic;
    }
  </style>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <!-- Icon stuff -->
  <link rel="shortcut icon" href="{{ site.github.url }}/images/favicon.ico">
</head>
