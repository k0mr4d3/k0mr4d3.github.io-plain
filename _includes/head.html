<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.author | escape }}{% endif %} &raquo; {{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <style type="text/css">
    body {
      background: #008080;
      color: #000000;
      font-family: Tahoma, Verdana, "DejaVu Sans", Arial, sans-serif;
      font-size: 15px;
      margin: 0;
      padding: 20px 8px;
    }

    .window {
      width: 800px;
      padding: 3px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;    border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;  border-bottom: 2px solid #808080;
    }
    @media screen and (min-width: 1px) {
      .window { width: 100%; max-width: 800px; box-sizing: border-box; }
    }

    .titlebar { background: #000080; padding: 3px; }
    .titlecaption { color: #ffffff; font-weight: bold; }

    .menubar { background: #c0c0c0; padding: 3px 2px; margin-top: 2px; }
    .menuitem { color: #000000; text-decoration: none; padding: 2px 10px; }
    .menuitem:hover { background: #000080; color: #ffffff; }

    .window-body { padding: 8px; }
    .content {
      background: #ffffff; color: #000000;
      padding: 16px 22px; font-size: 15px; line-height: 1.5;
      border-top: 2px solid #808080;   border-left: 2px solid #808080;
      border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff;
    }

    .statusbar { padding: 3px 4px 4px; }
    .statuscell {
      color: #000000; font-size: 12px; padding: 1px 6px;
      border-top: 1px solid #808080;   border-left: 1px solid #808080;
      border-right: 1px solid #ffffff; border-bottom: 1px solid #ffffff;
    }

    .highlight pre { margin: 0; line-height: 1.4; }
    .highlight .rouge-table { border-collapse: collapse; width: 100%; }
    .highlight .rouge-table td { padding: 0; vertical-align: top; }
    .highlight .rouge-gutter {
      text-align: right;
      color: #000000;
      min-width: 2em;
      padding: 0 8px;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    }
    .highlight .rouge-code { width: 100%; padding-left: 20px; }
    .highlight .rouge-code pre { overflow-x: auto; }

    .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn,
    .highlight .kp, .highlight .kr, .highlight .kt, .highlight .kv {
      font-weight: bold;
    }
    .highlight .c, .highlight .ch, .highlight .cm, .highlight .cp,
    .highlight .cpf, .highlight .c1, .highlight .cs, .highlight .cd {
      font-style: italic;
    }

    .caption {
      text-align: center;
      font-style: italic;
      font-size: 13px;
      color: #000066;
      margin: 2px 0 14px;
    }
  </style>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <link rel="shortcut icon" href="{{ site.github.url }}/images/favicon.ico">
</head>
